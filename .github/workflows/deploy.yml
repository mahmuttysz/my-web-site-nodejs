name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/nodejs/mahmuttuysuz.net
            git pull origin main
            npm ci
            npm run build
            pm2 reload /var/www/nodejs/mahmuttuysuz.net/dist/app.js --update-env
